services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yps
      POSTGRES_USER: yps
      POSTGRES_PASSWORD: yps_change_me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yps -d yps"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://yps:yps_change_me@db:5432/yps
      SECRET_KEY: change-me-in-local-dev
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
volumes:
  postgres_data:
